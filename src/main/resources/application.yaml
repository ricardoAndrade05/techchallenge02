spring:
  application:
    name: techchallenge02
  profiles:
    active: ${PROFILE}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    defer-datasource-initialization: ${JPA_DEFER_DATASOURCE_INIT}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: ${JPA_SHOW_SQL}
    properties:
      hibernate:
        '[format_sql]': ${JPA_FORMAT_SQL}
        dialect: ${JPA_DIALECT}
  sql:
    init:
      mode: ${SQL_INIT_MODE}